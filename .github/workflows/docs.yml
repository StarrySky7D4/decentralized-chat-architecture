name: Documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Markdown
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate documentation
        shell: pwsh
        run: ./scripts/validate-docs.ps1
